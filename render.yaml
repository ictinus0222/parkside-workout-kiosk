services:
  - type: web
    name: parkside-workout-kiosk
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /tmp/store.json
      - key: PUBLIC_BASE_URL
        sync: false
